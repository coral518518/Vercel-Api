# Fly.io 配置文件：Privatemode 官方机密计算代理 (ghcr.io/edgelesssys/privatemode/privatemode-proxy)
# 部署命令: fly deploy -c fly.privatemode.toml

app = "privatemode-official-proxy"
primary_region = "sjc"

[build]
  image = "ghcr.io/edgelesssys/privatemode/privatemode-proxy:latest"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
